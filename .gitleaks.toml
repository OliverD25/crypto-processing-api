title = "crypto-processing-api"

# Start from every rule gitleaks ships and add to it, never replace it.
[extend]
useDefault = true

[allowlist]
description = "Known false positives, kept as narrow as possible"

# gitleaks' generic-api-key rule fires on `readwrite_key, expected_amount="0.5"`
# in the deposit tests: it sees an identifier ending in `key` followed by an
# assignment and calls the amount a secret.
#
# The allowlist is a regex on the amount literal rather than a path exclusion
# for tests/. Excluding the whole test tree would also hide a real credential
# committed into a fixture, and this pattern cannot: an API key is not a bare
# decimal number.
# Matched against the whole line: the "secret" gitleaks extracts here is just
# the number, which on its own is far too generic to allowlist safely.
regexTarget = "line"
regexes = [
  '''expected_amount="-?[0-9.]+"''',
  # `dedup_key="fixture-delivery-1"` in scripts/make_upgrade_fixture.py. Same
  # rule, same shape of mistake: an identifier ending in `key`, an assignment,
  # and gitleaks calls the value a credential.
  #
  # Allowlisted by the `fixture-` prefix rather than by excluding the script.
  # Every seeded value in that file carries the prefix on purpose, so this
  # cannot hide a real credential unless someone names one `fixture-`, and a
  # path exclusion would have hidden the whole file forever.
  '''="fixture-[a-z0-9-]+"''',
]
