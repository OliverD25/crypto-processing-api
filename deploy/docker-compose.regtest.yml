# Local BTC end-to-end stack: bitcoind (regtest) + NBXplorer + BTCPay Server +
# BTCPay's Postgres + the ledger Postgres + this API.
#
#   docker compose -f deploy/docker-compose.regtest.yml up -d
#   python scripts/bootstrap_btcpay.py
#   sh scripts/dev/mine.sh 101
#
# Hand-rolled rather than generated by btcpayserver-docker: the generator is
# production-shaped (traefik, tor, ssh deployment hooks) and for development we
# want every service visible in one file. Image tags are pinned exactly —
# several Greenfield details this service depends on are version-dependent.
#
# USDT is not testable here. There is no TRON regtest; the USDt plugin ships
# Nile testnet support, which needs network access and lives in M4.
#
# Published host ports never use 8080, which is permanently occupied on some
# developer machines. Both published ports are overridable, because "a free
# port" is a property of your machine, not of this file:
#
#   CPAPI_HOST_PORT=9001 BTCPAY_HOST_PORT=14143 docker compose -f ... up -d
name: cpapi-regtest

services:
  postgres-btcpay:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - btcpay_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  postgres-ledger:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cpapi
      POSTGRES_PASSWORD: cpapi
      POSTGRES_DB: cpapi
    ports:
      - "127.0.0.1:54330:5432"
    volumes:
      - ledger_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cpapi -d cpapi"]
      interval: 5s
      timeout: 5s
      retries: 20

  bitcoind:
    image: btcpayserver/bitcoin:29.2
    environment:
      BITCOIN_NETWORK: regtest
      CREATE_WALLET: "false"
      BITCOIN_WALLETDIR: /walletdata
      BITCOIN_EXTRA_ARGS: |
        rpcport=43782
        rpcbind=0.0.0.0:43782
        rpcallowip=0.0.0.0/0
        port=39388
        whitelist=0.0.0.0/0
        fallbackfee=0.0002
    expose:
      - "43782"
      - "39388"
    volumes:
      - bitcoin_datadir:/data
      - bitcoin_walletdir:/walletdata

  nbxplorer:
    image: nicolasdorier/nbxplorer:2.6.10
    depends_on:
      postgres-btcpay:
        condition: service_healthy
      bitcoind:
        condition: service_started
    environment:
      NBXPLORER_NETWORK: regtest
      NBXPLORER_CHAINS: btc
      NBXPLORER_BIND: 0.0.0.0:32838
      NBXPLORER_TRIMEVENTS: 10000
      NBXPLORER_SIGNALFILESDIR: /datadir
      NBXPLORER_BTCRPCURL: http://bitcoind:43782/
      NBXPLORER_BTCNODEENDPOINT: bitcoind:39388
      NBXPLORER_POSTGRES: >-
        User ID=postgres;Password=postgres;Host=postgres-btcpay;Port=5432;
        Application Name=nbxplorer;MaxPoolSize=20;Database=nbxplorerregtest
    expose:
      - "32838"
    volumes:
      # NBXplorer reads bitcoind's auth cookie out of the shared data directory.
      - bitcoin_datadir:/root/.bitcoin
      - nbxplorer_datadir:/datadir

  btcpayserver:
    image: btcpayserver/btcpayserver:2.4.2
    depends_on:
      postgres-btcpay:
        condition: service_healthy
      nbxplorer:
        condition: service_started
    environment:
      BTCPAY_NETWORK: regtest
      BTCPAY_CHAINS: btc
      BTCPAY_BIND: 0.0.0.0:49392
      BTCPAY_ROOTPATH: /
      BTCPAY_DEBUGLOG: btcpay.log
      BTCPAY_DOCKERDEPLOYMENT: "false"
      BTCPAY_BTCEXPLORERURL: http://nbxplorer:32838/
      BTCPAY_POSTGRES: >-
        User ID=postgres;Password=postgres;Host=postgres-btcpay;Port=5432;
        Application Name=btcpayserver;Database=btcpayserverregtest
      BTCPAY_EXPLORERPOSTGRES: >-
        User ID=postgres;Password=postgres;Host=postgres-btcpay;Port=5432;
        Application Name=btcpayserver;MaxPoolSize=80;Database=nbxplorerregtest
    ports:
      - "127.0.0.1:${BTCPAY_HOST_PORT:-14142}:49392"
    volumes:
      - btcpay_datadir:/datadir
      - btcpay_pluginsdir:/root/.btcpayserver/Plugins
      - nbxplorer_datadir:/root/.nbxplorer

  api:
    build:
      context: ..
      dockerfile: Dockerfile
    depends_on:
      postgres-ledger:
        condition: service_healthy
    environment:
      ENVIRONMENT: development
      DEBUG: "false"
      LOG_JSON: "false"
      DATABASE_URL: postgresql://cpapi:cpapi@postgres-ledger:5432/cpapi
      BTCPAY_URL: http://btcpayserver:49392
    ports:
      - "127.0.0.1:${CPAPI_HOST_PORT:-8095}:8000"
    command:
      - sh
      - -c
      - >-
        python -m crypto_processing_api.cli migrate &&
        uvicorn crypto_processing_api.main:app --host 0.0.0.0 --port 8000

volumes:
  btcpay_postgres:
  ledger_postgres:
  bitcoin_datadir:
  bitcoin_walletdir:
  nbxplorer_datadir:
  btcpay_datadir:
  btcpay_pluginsdir:
