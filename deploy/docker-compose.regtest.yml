# Local BTC end-to-end stack: bitcoind (regtest) + NBXplorer + BTCPay Server +
# BTCPay's Postgres + the ledger Postgres + this API.
#
#   docker compose -f deploy/docker-compose.regtest.yml up -d
#   python scripts/bootstrap_btcpay.py
#   sh scripts/dev/mine.sh 101
#
# Hand-rolled rather than generated by btcpayserver-docker: the generator is
# production-shaped (traefik, tor, ssh deployment hooks) and for development we
# want every service visible in one file. Image tags are pinned exactly —
# several Greenfield details this service depends on are version-dependent.
#
# USDT is not testable here. There is no TRON regtest; the USDt plugin ships
# Nile testnet support, which needs network access and lives in M4.
#
# Published host ports never use 8080, which is permanently occupied on some
# developer machines. Both published ports are overridable, because "a free
# port" is a property of your machine, not of this file:
#
#   CPAPI_HOST_PORT=9001 BTCPAY_HOST_PORT=14143 docker compose -f ... up -d
#
# The worked example application (examples/platform-demo) is an opt-in profile.
# Turn it on with the environment variable rather than with `--profile`:
#
#   COMPOSE_PROFILES=example docker compose -f deploy/docker-compose.regtest.yml up -d --build
#
# Both spellings start the demo, but only the variable is visible to the
# interpolation below, and that is what points the api's outbound webhooks at
# it. See the `example-app` service at the bottom of this file.
name: cpapi-regtest

# The one secret the api and the demo must agree on, written once so they
# cannot drift apart. Obviously fake, and a regtest stack is the only place it
# is ever used.
x-example-webhook: &example_webhook
  PLATFORM_WEBHOOK_SECRET: "regtest-example-webhook-secret"

services:
  postgres-btcpay:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - btcpay_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  postgres-ledger:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cpapi
      POSTGRES_PASSWORD: cpapi
      POSTGRES_DB: cpapi
    ports:
      - "127.0.0.1:54330:5432"
    volumes:
      - ledger_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cpapi -d cpapi"]
      interval: 5s
      timeout: 5s
      retries: 20

  bitcoind:
    image: btcpayserver/bitcoin:29.2
    environment:
      BITCOIN_NETWORK: regtest
      CREATE_WALLET: "false"
      BITCOIN_WALLETDIR: /walletdata
      BITCOIN_EXTRA_ARGS: |
        rpcport=43782
        rpcbind=0.0.0.0:43782
        rpcallowip=0.0.0.0/0
        port=39388
        whitelist=0.0.0.0/0
        fallbackfee=0.0002
    expose:
      - "43782"
      - "39388"
    volumes:
      - bitcoin_datadir:/data
      - bitcoin_walletdir:/walletdata

  nbxplorer:
    image: nicolasdorier/nbxplorer:2.6.10
    depends_on:
      postgres-btcpay:
        condition: service_healthy
      bitcoind:
        condition: service_started
    environment:
      NBXPLORER_NETWORK: regtest
      NBXPLORER_CHAINS: btc
      NBXPLORER_BIND: 0.0.0.0:32838
      NBXPLORER_TRIMEVENTS: 10000
      NBXPLORER_SIGNALFILESDIR: /datadir
      NBXPLORER_BTCRPCURL: http://bitcoind:43782/
      NBXPLORER_BTCNODEENDPOINT: bitcoind:39388
      NBXPLORER_POSTGRES: >-
        User ID=postgres;Password=postgres;Host=postgres-btcpay;Port=5432;
        Application Name=nbxplorer;MaxPoolSize=20;Database=nbxplorerregtest
    expose:
      - "32838"
    volumes:
      # NBXplorer reads bitcoind's auth cookie out of the shared data directory.
      - bitcoin_datadir:/root/.bitcoin
      - nbxplorer_datadir:/datadir

  btcpayserver:
    image: btcpayserver/btcpayserver:2.4.2
    depends_on:
      postgres-btcpay:
        condition: service_healthy
      nbxplorer:
        condition: service_started
    environment:
      BTCPAY_NETWORK: regtest
      BTCPAY_CHAINS: btc
      BTCPAY_BIND: 0.0.0.0:49392
      BTCPAY_ROOTPATH: /
      BTCPAY_DEBUGLOG: btcpay.log
      BTCPAY_DOCKERDEPLOYMENT: "false"
      BTCPAY_BTCEXPLORERURL: http://nbxplorer:32838/
      BTCPAY_POSTGRES: >-
        User ID=postgres;Password=postgres;Host=postgres-btcpay;Port=5432;
        Application Name=btcpayserver;Database=btcpayserverregtest
      BTCPAY_EXPLORERPOSTGRES: >-
        User ID=postgres;Password=postgres;Host=postgres-btcpay;Port=5432;
        Application Name=btcpayserver;MaxPoolSize=80;Database=nbxplorerregtest
    ports:
      - "127.0.0.1:${BTCPAY_HOST_PORT:-14142}:49392"
    volumes:
      - btcpay_datadir:/datadir
      - btcpay_pluginsdir:/root/.btcpayserver/Plugins
      - nbxplorer_datadir:/root/.nbxplorer

  api:
    build:
      context: ..
      dockerfile: Dockerfile
    depends_on:
      postgres-ledger:
        condition: service_healthy
    environment: &api_env
      <<: *example_webhook
      ENVIRONMENT: development
      DEBUG: "false"
      LOG_JSON: "false"
      DATABASE_URL: postgresql://cpapi:cpapi@postgres-ledger:5432/cpapi
      BTCPAY_URL: http://btcpayserver:49392
      # Which network withdrawal destinations are validated against. Note the
      # name collision: bitcoind's image reads BITCOIN_NETWORK too, so this has
      # to be set on the api and worker explicitly rather than inherited.
      BITCOIN_NETWORK: regtest
      # No outbound calls from a local stack.
      MEMPOOL_SPACE_URL: ""
      # Short enough that the late-payment drill does not take an afternoon,
      # long enough that an ordinary deposit is never racing the clock.
      DEPOSIT_INVOICE_EXPIRY_MIN_BTC: "2"
      # Fast loops so a drill finishes while you are still watching it.
      WEBHOOK_POLL_INTERVAL_SECONDS: "2"
      RECONCILE_DEPOSIT_INTERVAL_SECONDS: "15"
      WALLET_SCAN_INTERVAL_SECONDS: "30"
      OUTBOUND_DELIVERY_INTERVAL_SECONDS: "3"
      # Where outbound webhooks go — the demo container, and nowhere at all
      # without it. `${VAR:+value}` is compose's "only if VAR is set" form, and
      # COMPOSE_PROFILES is compose's own way of switching a profile on, so the
      # two can never get out of step: no profile, no URL, no delivery
      # attempts. An empty string here reads as unset, which is what leaves the
      # default stack exactly as it was.
      #
      # It reacts to any profile rather than to this one by name, because
      # compose has no way to ask which profiles are active. This file has one
      # profile, so the two questions have the same answer.
      PLATFORM_WEBHOOK_URL: ${COMPOSE_PROFILES:+http://example-app:8000/platform-webhook}
    # Written by scripts/bootstrap_btcpay.py; absent until it has run once,
    # which is why the api can still start and answer /healthz without it.
    env_file: &api_env_file
      - path: ../.env.regtest.generated
        required: false
    ports:
      - "127.0.0.1:${CPAPI_HOST_PORT:-8095}:8000"
    command:
      - sh
      - -c
      - >-
        python -m crypto_processing_api.cli migrate &&
        uvicorn crypto_processing_api.main:app --host 0.0.0.0 --port 8000

  worker:
    # Same image, different command. Webhooks only reduce latency; this is the
    # process that makes deposits correct.
    build:
      context: ..
      dockerfile: Dockerfile
    depends_on:
      api:
        condition: service_started
    environment: *api_env
    env_file: *api_env_file
    command: ["python", "-m", "crypto_processing_api.workers.runner"]
    # The image's healthcheck probes /healthz, which only the api serves. The
    # worker has no HTTP surface, so inheriting it just reports "unhealthy"
    # forever and trains everyone to ignore the column.
    healthcheck:
      disable: true

  # ---------------------------------------------------------------- example
  # The worked platform integration, examples/platform-demo. Opt-in, so a
  # developer working on the service never boots it, and the drills are
  # untouched.
  #
  # It needs an API key, and a key can only be minted where the ledger database
  # is. That is what this one-shot container is: it runs the service's own CLI,
  # leaves the key in a shared volume and exits. In production your operator
  # mints one and hands it over out of band; here it happens so that bringing
  # the demo up is a single command.
  example-keymint:
    profiles: ["example"]
    # The same build as the api. Compose tags it separately, and every layer is
    # a cache hit, so this costs seconds rather than a second image build.
    build:
      context: ..
      dockerfile: Dockerfile
    depends_on:
      api:
        # Not `service_started`: the api's command runs the migrations, and
        # there is no api_keys table to write into until it has.
        condition: service_healthy
    environment: *api_env
    env_file: *api_env_file
    # A fresh named volume is created owned by root, and this container has to
    # write into it. The demo reads the file as an ordinary user.
    user: root
    volumes:
      - example_key:/keys
    # The CLI prints the key on stdout and everything else on stderr, so the
    # redirection captures the key and nothing but the key.
    command:
      - sh
      - -c
      - >-
        python -m crypto_processing_api.cli create-api-key
        --name platform-demo --scope readwrite > /keys/platform.key
    # A container that is meant to exit has nothing to probe.
    healthcheck:
      disable: true

  example-app:
    profiles: ["example"]
    build:
      # The repository root, because the image installs the Python SDK from
      # sdks/python rather than from PyPI.
      context: ..
      dockerfile: examples/platform-demo/Dockerfile
    depends_on:
      example-keymint:
        condition: service_completed_successfully
    environment:
      <<: *example_webhook
      # Container to container, so the demo never leaves this network.
      CPAPI_BASE_URL: http://api:8000
      CPAPI_API_KEY_FILE: /keys/platform.key
    volumes:
      - example_key:/keys:ro
    ports:
      - "127.0.0.1:${EXAMPLE_HOST_PORT:-8096}:8000"

volumes:
  btcpay_postgres:
  ledger_postgres:
  bitcoin_datadir:
  bitcoin_walletdir:
  nbxplorer_datadir:
  btcpay_datadir:
  btcpay_pluginsdir:
  example_key:
