name: Feature request
description: Something the service should do and does not.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Check [`ROADMAP.md`](https://github.com/OliverD25/crypto-processing-api/blob/main/ROADMAP.md)
        first — it has a **Not planned** section, and a request that lands
        there gets a link rather than a discussion.

  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: >-
        What you are trying to do and where it stops. Not the solution yet —
        the situation. A problem statement outlives a proposal.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What you would build
      description: The endpoint, the field, the flag, the worker. Rough is fine.
    validations:
      required: true

  - type: dropdown
    id: money_path
    attributes:
      label: Does this touch the money path?
      description: >-
        Anything under `src/crypto_processing_api/ledger/` or
        `src/crypto_processing_api/services/`. Say yes if you are unsure; it
        changes how the change gets reviewed, not whether it is welcome.
      options:
        - "No — API surface, docs, ops, tooling"
        - "Yes — it changes how money moves or is recorded"
        - "I do not know"
    validations:
      required: true

  - type: textarea
    id: invariants
    attributes:
      label: Which ledger invariant does it touch, if any?
      description: >-
        The nine are listed in
        [`CONTRIBUTING.md`](https://github.com/OliverD25/crypto-processing-api/blob/main/CONTRIBUTING.md#the-money-path-rule).
        Naming the one your change is nearest to is usually enough to show
        whether it fits — and "none of them" is a fine answer that saves a
        round trip.
      placeholder: >-
        e.g. #7 one payout per withdrawal, one transaction id per withdrawal —
        this adds a second backend and must keep that true.

  - type: textarea
    id: alternatives
    attributes:
      label: What you tried instead
      description: >-
        Including "did it in my platform's own code". Knowing what the
        workaround costs is what decides whether this belongs here at all.
