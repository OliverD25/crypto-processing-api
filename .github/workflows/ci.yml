name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .

  typecheck:
    name: mypy --strict
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: mypy

  unit:
    name: unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest tests/unit -q

  integration:
    name: integration tests + ledger coverage
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cpapi
          POSTGRES_PASSWORD: cpapi
          POSTGRES_DB: cpapi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cpapi -d cpapi_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # The service container publishes on the standard port; the local
      # compose file uses 54329 to stay out of a developer's way.
      TEST_DATABASE_URL: postgresql+psycopg://cpapi:cpapi@localhost:5432/cpapi_test
      # Derandomized and small. A pull request must not go red on someone
      # else's luck; the wide random search is the nightly job's problem.
      HYPOTHESIS_PROFILE: ci
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -e ".[dev]"
      # The ledger is the only module with a coverage floor. It is the module
      # where an untested branch is a lost coin.
      - run: >-
          pytest -q
          --cov=src/crypto_processing_api/ledger
          --cov-report=term-missing
          --cov-fail-under=85
      # A property failure is a sequence of steps, and the sequence lives in
      # this directory. Without it the log says a counterexample was found and
      # gives you no way to run it again.
      - name: Keep the failing counterexample
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: hypothesis-examples
          path: .hypothesis/
          if-no-files-found: ignore

  migration-checks:
    name: migration checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cpapi
          POSTGRES_PASSWORD: cpapi
          POSTGRES_DB: cpapi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cpapi -d cpapi_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://cpapi:cpapi@localhost:5432/cpapi_test
      ENVIRONMENT: test
      BITCOIN_NETWORK: regtest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -e ".[dev]"
      # Deliberately the command line, not the test that wraps it. The tests
      # inject their target with `-x db_url=`; only this exercises the path an
      # operator actually uses, where env.py resolves DATABASE_URL itself.
      - name: The migrations must reach head
        run: alembic upgrade head
      - name: The models and the migrations must agree
        run: alembic check
      - name: There must be exactly one head
        run: |
          count=$(alembic heads | grep -c .)
          if [ "$count" -ne 1 ]; then
            echo "::error::expected 1 migration head, found $count"
            alembic heads
            exit 1
          fi

  contracts:
    name: published contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -e ".[dev]"
      # Two generated files feed the SDKs: the OpenAPI document and the JSON
      # Schema of the outbound webhook events. Neither has a runtime test that
      # would notice it going stale — a route or a payload can change and the
      # committed spec simply describes the old one, and the generated client
      # then disagrees with the server in the field. This is the only thing
      # that notices.
      - name: The committed contracts must be what the code produces
        run: python scripts/export_openapi.py --check
      # The third generated contract: the webhook signature vectors that the
      # server and both SDKs assert against. Hand-editing one is how three
      # implementations of an HMAC scheme stop agreeing, so the file is gated
      # exactly like the other two.
      - name: The committed signature vectors must be what the signer produces
        run: python scripts/export_signature_vectors.py --check
      # Belt and braces: --check compares content, this catches anything that
      # rewrites the files without changing what the script would write (a line
      # ending, an editor's trailing newline).
      - name: The working tree must be clean after a regeneration
        run: |
          python scripts/export_openapi.py
          python scripts/export_signature_vectors.py
          git diff --exit-code -- docs/reference sdks/signature-vectors.json

  semgrep:
    name: semgrep
    runs-on: ubuntu-latest
    container:
      # Pinned exactly. A scanner that silently changes its rules between runs
      # turns a green build into an unfalsifiable claim.
      image: semgrep/semgrep:1.172.0
    steps:
      - uses: actions/checkout@v7
      # `p/python` is the registry's general Python suite; `.semgrep/` holds the
      # architecture rules specific to this codebase. `--error` is what makes a
      # finding fail the build rather than decorate a log nobody opens.
      - run: semgrep scan --config .semgrep/ --config p/python --error --metrics=off

  secrets:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Scan the history, not just the tip: a key removed in a later commit
          # is still a leaked key.
          fetch-depth: 0
      - name: Scan for committed secrets
        run: >-
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1
          detect --source=/repo --config=/repo/.gitleaks.toml --redact --verbose

  btcpay-compat:
    name: BTCPay compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -e ".[dev]"
      # Asserts the endpoints and fields this service depends on still exist in
      # the pinned tag. Drift here does not crash anything — it silently stops
      # crediting deposits.
      - run: python scripts/check_btcpay_compat.py

  docker:
    name: docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build the API image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: crypto-processing-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: The image must be able to run the CLI
        run: docker run --rm crypto-processing-api:ci python -m crypto_processing_api.cli --help
