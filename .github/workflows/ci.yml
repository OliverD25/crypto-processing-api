name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .

  typecheck:
    name: mypy --strict
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: mypy

  unit:
    name: unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest tests/unit -q

  integration:
    name: integration tests + ledger coverage
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cpapi
          POSTGRES_PASSWORD: cpapi
          POSTGRES_DB: cpapi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cpapi -d cpapi_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # The service container publishes on the standard port; the local
      # compose file uses 54329 to stay out of a developer's way.
      TEST_DATABASE_URL: postgresql+psycopg://cpapi:cpapi@localhost:5432/cpapi_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -e ".[dev]"
      # The ledger is the only module with a coverage floor. It is the module
      # where an untested branch is a lost coin.
      - run: >-
          pytest -q
          --cov=src/crypto_processing_api/ledger
          --cov-report=term-missing
          --cov-fail-under=85

  secrets:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Scan the history, not just the tip: a key removed in a later commit
          # is still a leaked key.
          fetch-depth: 0
      - name: Scan for committed secrets
        run: >-
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1
          detect --source=/repo --redact --verbose

  docker:
    name: docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Build the API image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: crypto-processing-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: The image must be able to run the CLI
        run: docker run --rm crypto-processing-api:ci python -m crypto_processing_api.cli --help
